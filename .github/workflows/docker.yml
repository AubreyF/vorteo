name: Container

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker.yml"
      - ".dockerignore"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/**"
      - "skills/**"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "packages/app/**"
      - "packages/cli/**"
      - "packages/client/**"
      - "packages/expo-two-way-audio/**"
      - "packages/highlight/**"
      - "packages/plugin/**"
      - "packages/protocol/**"
      - "packages/relay/**"
      - "packages/server/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker.yml"
      - ".dockerignore"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/**"
      - "skills/**"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "packages/app/**"
      - "packages/cli/**"
      - "packages/client/**"
      - "packages/expo-two-way-audio/**"
      - "packages/highlight/**"
      - "packages/plugin/**"
      - "packages/protocol/**"
      - "packages/relay/**"
      - "packages/server/**"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check container runtime and installation
        run: |
          python3 -B docker/multiplex/test_install.py
          python3 -B docker/tailscale/test_network.py
          python3 -B docker/tailscale/test_launch_agent.py
          python3 -B docker/tailscale/test_https_broker.py
          python3 -B docker/tailscale/test_host_recovery.py
          python3 -B docker/tailscale/test_host_config.py
          python3 -B docker/private-domain/native/test_native_gateway.py
          python3 -B docker/private-domain/native/test_hosted_app.py
          python3 -B docker/tailscale/test_scratch_reaper.py
          node --test docker/tailscale/initialize-web.test.mjs
          bash -n docker/multiplex/install.sh docker/multiplex/connect.sh docker/multiplex/update.sh docker/multiplex/common.sh docker/tailscale/entrypoint docker/tailscale/start-paseo
      - name: Validate the single Compose recipe
        env:
          PASEO_IMAGE: paseo-container:check
          PASEO_INSTANCE: ci-check
          PASEO_PASSWORD: ci-disposable-password
        run: docker compose -f docker/multiplex/compose.yaml config --quiet

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          build-args: PASEO_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/${{ matrix.architecture }}
          tags: paseo-container:check
          load: true
          provenance: false
          cache-from: type=gha,scope=multiplex-${{ matrix.architecture }}
          cache-to: type=gha,scope=multiplex-${{ matrix.architecture }},mode=max
      - name: Verify packaged tools, privilege drop and fresh web state
        run: bash docker/multiplex/smoke.sh paseo-container:check
