pre-commit:
  parallel: false
  jobs:
    - name: vorton-version
      run: node scripts/vorton-version.mjs --hook
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: npm run lint -- {staged_files}
    - name: fresh-declarations
      run: node scripts/ensure-fresh-declarations.mjs
    - name: typecheck
      run: npm run typecheck

pre-push:
  jobs:
    - name: secrets
      run: npm run security:secrets
    - name: builds-only-main
      run: node scripts/guard-main-push.mjs
      use_stdin: true
