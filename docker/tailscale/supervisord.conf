[unix_http_server]
file=/run/personal-tailscale/supervisor.sock
chmod=0600

[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/personal-tailscale/supervisor.pid
childlogdir=/run/personal-tailscale

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/personal-tailscale/supervisor.sock

[program:tailscale]
command=/usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root /usr/local/sbin/tailscaled --tun=tailscale0 --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock
priority=10
autostart=%(ENV_PASEO_TAILSCALE_AUTOSTART)s
autorestart=unexpected
startsecs=60
startretries=3
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:paseo]
command=/bin/bash /opt/personal-tailscale/start-paseo
priority=20
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
