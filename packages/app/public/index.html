<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#222222" />
    <link rel="stylesheet" href="/appearance-fonts/vorton-fonts-6e84901.css" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vorteo" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
      data-paseo-status-bar-style="black-translucent"
    />
    <script>
      // Installation captures this value. Translucent shortcuts must be replaced to change it.
      (() => {
        const appleHandheld =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (!appleHandheld) return;
        document.documentElement.dataset.vortonIosStandalone = String(
          navigator.standalone === true,
        );
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content =
          "default";
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" href="/vorteo-favicon-fa002b83cde0.png" />
    <link rel="mask-icon" href="/vorteo-pinned-tab-fa002b83cde0.svg" color="#3b82f6" />
    <link rel="manifest" href="/manifest-vorteo-fa002b83cde0.json" />
    <link rel="apple-touch-icon" href="/vorteo-apple-touch-fa002b83cde0.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Keep the app shell fixed to the viewport. */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles smooth text rendering in the app shell. */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent white flash before React mounts */
      html,
      body {
        background-color: #222222;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        width: 100%;
        height: 100%;
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
    </style>
    <style>
      #vorton-ios-status-strip {
        display: none;
      }
      /* WebKit samples fixed backgrounds to suppress its native scroll pocket.
         11px exceeds its 10px threshold; clipping an empty element paints no pixels.
         https://zenn.dev/uakihir0/articles/260920-ios27-pwa-blur */
      html[data-vorton-ios-standalone="true"] #vorton-ios-status-strip {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 11px;
        z-index: 2147483647;
        pointer-events: none;
        background-color: var(--colors-surface-sidebar, #f4f4f5);
        -webkit-background-clip: text;
        background-clip: text;
      }
      @media (prefers-color-scheme: dark) {
        html[data-vorton-ios-standalone="true"] #vorton-ios-status-strip {
          background-color: var(--colors-surface-sidebar, #141716);
        }
      }
      button,
      a,
      input,
      textarea,
      select,
      [role="button"],
      [role="link"],
      [role="textbox"],
      [role="combobox"],
      [role="tab"],
      [role="switch"],
      [role="checkbox"],
      [role="slider"],
      [role="menuitem"],
      [tabindex],
      [contenteditable="true"] {
        -webkit-app-region: no-drag !important;
      }

      /* Suppress the browser's default focus outline — it appears on mouse
         clicks and looks out of place against our themed surfaces. Keep a
         themed ring for keyboard users via :focus-visible. */
      *:focus {
        outline: none;
      }
      *:focus-visible {
        outline: 2px solid #20744a;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="vorton-ios-status-strip" aria-hidden="true"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- React replaces this shell when it mounts, including its timeout UI. -->
      <div id="boot-status" hidden>
        <div class="boot-emblem" aria-hidden="true">
          <div class="boot-spinner"></div>
          <!-- Inline the approved brand silhouette so it paints before assets load. -->
          <svg class="boot-mark" viewBox="0 0 640 640" focusable="false">
            <g
              transform="translate(0.000000,640.000000) scale(0.100000,-0.100000)"
              fill="#ffffff"
              stroke="none"
            >
              <path
                d="M4741 5040 c-161 -43 -330 -157 -521 -349 -382 -383 -703 -992 -1136

53 -12 78 -1 51 9 64 76 98 102 51 216 52 317 2z"
              />
            </g>
          </svg>
        </div>
        <p role="status">Loading app</p>
        <div id="boot-help" hidden role="status">
          <p>Taking longer than expected.</p>
          <p>Check your internet connection and VPN, if required.</p>
          <p>Make sure the host is awake and Vorteo is running, then reload.</p>
          <button type="button" onclick="window.location.reload()">Reload</button>
        </div>
      </div>
    </div>
    <style>
      #boot-status {
        margin: auto;
        padding: 24px;
        max-width: 360px;
        text-align: center;
        font:
          14px system-ui,
          sans-serif;
        color: #a9b5ad;
      }
      #boot-help {
        font-size: 13px;
        line-height: 1.5;
      }
      #boot-help button {
        min-height: 44px;
        padding: 8px 20px;
        border: 1px solid currentColor;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .boot-emblem {
        position: relative;
        width: 160px;
        height: 160px;
        margin: 0 auto 24px;
      }
      .boot-mark {
        position: absolute;
        inset: 8px;
        width: 144px;
        height: 144px;
      }
      .boot-spinner {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 1px solid #ffffff26;
        border-top-color: #ffffffd9;
        border-radius: 50%;
        animation: boot-spin 1.6s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }
    </style>
    <script>
      document.getElementById("boot-status").hidden = false;
      setTimeout(function () {
        var help = document.getElementById("boot-help");
        if (help) help.hidden = false;
      }, 10000);
    </script>
  </body>
</html>
