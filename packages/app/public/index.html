    <meta name="apple-mobile-web-app-title" content="Vorteo" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
      data-paseo-status-bar-style="black-translucent"
    />
    <script>
      // Installation captures this value. Translucent shortcuts must be replaced to change it.
      (() => {
        const appleHandheld =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (!appleHandheld) return;
        document.documentElement.dataset.vortonIosStandalone = String(
          navigator.standalone === true,
        );
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content =
          "default";
      })();
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Keep the app shell fixed to the viewport. */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles smooth text rendering in the app shell. */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent white flash before React mounts */
      html,
      body {
        background-color: #222222;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        width: 100%;
        height: 100%;
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
    </style>
    <style>
      #vorton-ios-status-strip {
        display: none;
      }
      /* WebKit samples fixed backgrounds to suppress its native scroll pocket.
         11px exceeds its 10px threshold; clipping an empty element paints no pixels.
         https://zenn.dev/uakihir0/articles/260920-ios27-pwa-blur */
      html[data-vorton-ios-standalone="true"] #vorton-ios-status-strip {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 11px;
        z-index: 2147483647;
        pointer-events: none;
        background-color: var(--colors-surface-sidebar, #f4f4f5);
        -webkit-background-clip: text;
        background-clip: text;
      }
      @media (prefers-color-scheme: dark) {
        html[data-vorton-ios-standalone="true"] #vorton-ios-status-strip {
          background-color: var(--colors-surface-sidebar, #141716);
        }
      }
      button,
      a,
      input,
      textarea,
      select,
      [role="button"],
      [role="link"],
      [role="textbox"],
      [role="combobox"],
      [role="tab"],
      [role="switch"],
      [role="checkbox"],
      [role="slider"],
      [role="menuitem"],
      [tabindex],
      [contenteditable="true"] {
        -webkit-app-region: no-drag !important;
      }

      /* Suppress the browser's default focus outline — it appears on mouse
         clicks and looks out of place against our themed surfaces. Keep a
         themed ring for keyboard users via :focus-visible. */
      *:focus {
        outline: none;
      }
      *:focus-visible {
        outline: 2px solid #20744a;
        outline-offset: 2px;
      }
    </style>
  </head>

        <div id="boot-help" hidden role="status">
          <p>Taking longer than expected.</p>
          <p>Check your internet connection and VPN, if required.</p>
          <p>Make sure the host is awake and Vorteo is running, then reload.</p>

    <style>
      #boot-status {
        margin: auto;
        padding: 24px;
        max-width: 360px;
        text-align: center;
        font:
          14px system-ui,
          sans-serif;
        color: var(--boot-ring-color, #a9b5ad);
      }
      #boot-help {
        margin-top: 24px;
        font-size: 13px;
        line-height: 1.5;
      }
      #boot-help button {
        min-height: 44px;
        padding: 8px 20px;
        border: 1px solid currentColor;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .boot-emblem {
        position: relative;
        width: 160px;
        height: 160px;
        margin: 0 auto;
      }
      .boot-mark {
        position: absolute;
        inset: 8px;
        width: 144px;
        height: 144px;
      }
      .boot-emblem::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid color-mix(in srgb, var(--boot-ring-color, #ffffff) 10%, transparent);
        border-radius: 50%;
      }
      .boot-spinner {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          transparent 0deg 240deg,
          color-mix(in srgb, var(--boot-ring-color, #ffffff) 7%, transparent) 250deg,
          var(--boot-ring-color, #ffffff) 360deg
        );
        -webkit-mask-image: radial-gradient(
          farthest-side,
          transparent calc(100% - 1px),
          #000 calc(100% - 0.5px)
        );
        mask-image: radial-gradient(
          farthest-side,
          transparent calc(100% - 1px),
          #000 calc(100% - 0.5px)
        );
        animation: boot-spin 1.6s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }
    </style>
    <script>
      // Cache only validated display colors so the first frame matches the last active theme.
      window.__vorteoApplyBootBrand = function (brand) {
        if (!brand || !["white", "rainbow", "gradient"].includes(brand.mode)) return;
        if (
          ![brand.start, brand.end, brand.background, brand.foreground].every(function (value) {
            return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);
          })
        )
          return;
        var mark = document.querySelector(".boot-mark");
        if (!mark) return;
        var white = mark.dataset.whiteSrc || mark.src;
        mark.dataset.whiteSrc = white;
        mark.src = brand.mode === "rainbow" ? "/vorteo-logo-color-a9e1bd827ba3.png" : white;
        var tint = document.getElementById("boot-tinted-mark");
        if (!tint) {
          tint = document.createElement("div");
          tint.id = "boot-tinted-mark";
          tint.className = "boot-mark";
          tint.setAttribute("aria-hidden", "true");
          mark.parentElement.appendChild(tint);
        }
        tint.style.background = "linear-gradient(135deg, " + brand.start + ", " + brand.end + ")";
        tint.style.webkitMask = 'url("' + white + '") center / contain no-repeat';
        tint.style.mask = 'url("' + white + '") center / contain no-repeat';
        tint.hidden = brand.mode !== "gradient";
        mark.hidden = brand.mode === "gradient";
        document.documentElement.style.backgroundColor = brand.background;
        document.body.style.backgroundColor = brand.background;
        document.documentElement.style.setProperty("--boot-ring-color", brand.foreground);
      };
      try {
        window.__vorteoApplyBootBrand(JSON.parse(localStorage.getItem("vorteo-boot-brand-v1")));
      } catch (_) {
        /* Storage may be unavailable; the neutral dark loader remains usable. */
      }
      document.getElementById("boot-status").hidden = false;
      setTimeout(function () {
        var help = document.getElementById("boot-help");
        if (help) help.hidden = false;
      }, 10000);
    </script>
  </body>
